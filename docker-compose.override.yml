services:
  nginx:
    restart: "no"
    volumes:
      - ./nginx/default.local.conf:/etc/nginx/conf.d/default.conf:ro

  backend:
    restart: "no"
    command: ["sleep", "infinity"]
    volumes:
      - ./backend:/app
      - ${SSH_AUTH_SOCK}:/ssh-agent
    environment:
      SSH_AUTH_SOCK: /ssh-agent

  db:
    restart: "no"
